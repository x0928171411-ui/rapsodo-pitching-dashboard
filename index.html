<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapsodo Pitching Dashboard - 放球點穩定度與共軌分析系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
        .input-field { background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 0.5rem; padding: 0.5rem 0.75rem; }
        .input-field:focus { outline: none; border-color: #38bdf8; }
        .input-disabled { background-color: #1e293b; border: 1px solid #334155; color: #38bdf8; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-slate-700">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-sky-400 flex items-center gap-2">
                    <i data-lucide="target"></i> Rapsodo Pitching Dashboard
                </h1>
                <p class="text-slate-400 text-sm mt-1">投手多球種放球點一致性 (Release Point Silhouette) 與進壘共軌分析系統</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <span id="syncStatus" class="px-3 py-1 bg-amber-950 text-amber-400 border border-amber-700/50 rounded-full text-xs font-medium flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    雲端連線中...
                </span>
                
                <label class="flex items-center gap-1.5 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-medium cursor-pointer transition">
                    <i data-lucide="file-up" class="w-4 h-4"></i> 匯入 Rapsodo CSV
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importCSV(event)">
                </label>
            </div>
        </div>

        <!-- Controls & Athlete Selection Bar -->
        <div class="card p-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div class="flex items-center gap-2">
                    <i data-lucide="user" class="text-sky-400"></i>
                    <span class="font-medium text-sm text-slate-300">選擇投手：</span>
                    <select id="athleteSelect" onchange="onAthleteChange()" class="input-field min-w-[150px] font-semibold text-sky-300">
                        <option value="">請先匯入資料</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 ml-0 md:ml-4 border-l-0 md:border-l border-slate-600 md:pl-4">
                    <i data-lucide="baseball" class="text-amber-400"></i>
                    <span class="font-medium text-sm text-slate-300">主分析球種：</span>
                    <select id="pitchTypeSelect" onchange="updateDashboard()" class="input-field min-w-[180px] font-semibold text-amber-300">
                        <option value="">無球種資料</option>
                    </select>
                </div>
                
                <button onclick="openAthleteModal()" class="ml-auto md:ml-4 flex items-center gap-1 px-3 py-1.5 bg-sky-600/30 hover:bg-sky-600/50 text-sky-300 border border-sky-500/50 rounded-lg text-xs transition">
                    <i data-lucide="edit" class="w-3 h-3"></i> 編輯基本資料
                </button>
            </div>
            
            <div id="athleteProfile" class="text-sm text-slate-300 hidden md:flex items-center gap-4 bg-slate-800/60 px-4 py-2 rounded-lg border border-slate-700"></div>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-2 md:grid-cols-7 gap-3">
            <div class="card p-3 bg-slate-800/50"><div class="text-slate-400 text-xs">最新日期</div><div id="kpiDate" class="text-base md:text-lg font-bold text-white mt-1">--</div></div>
            <div class="card p-3 bg-slate-800/50"><div class="text-slate-400 text-xs">用球數</div><div id="kpiCount" class="text-base md:text-lg font-bold text-sky-300 mt-1">--</div></div>
            <div class="card p-3 bg-slate-800/50"><div class="text-slate-400 text-xs">均速 / 極速 (mph)</div><div id="kpiSpeed" class="text-base md:text-lg font-bold text-emerald-400 mt-1">-- / --</div></div>
            <div class="card p-3 bg-slate-800/50 border border-purple-500/30"><div class="text-slate-400 text-xs">球速標準差 (SD)</div><div id="kpiSD" class="text-base md:text-lg font-bold text-purple-400 mt-1">--</div></div>
            <div class="card p-3 bg-slate-800/50"><div class="text-slate-400 text-xs">平均放球點高度</div><div id="kpiRelHeight" class="text-base md:text-lg font-bold text-sky-300 mt-1">-- 呎</div></div>
            <div class="card p-3 bg-slate-800/50"><div class="text-slate-400 text-xs">平均總轉速 (RPM)</div><div id="kpiSpin" class="text-base md:text-lg font-bold text-amber-400 mt-1">--</div></div>
            <div class="card p-3 bg-slate-800/50"><div class="text-slate-400 text-xs">出手穩定評價</div><div id="kpiEval" class="text-xs md:text-sm font-bold text-amber-300 mt-1 leading-tight">--</div></div>
        </div>

        <!-- Charts Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card p-4 md:p-6">
                <div class="mb-2"><h2 class="text-lg font-semibold flex items-center gap-2"><i data-lucide="trending-up" class="text-sky-400"></i> 球速成長趨勢 (均速 vs 極速)</h2><p class="text-xs text-slate-400 mt-1">觀察不同日期的球速演進</p></div>
                <div id="speedChart" class="w-full h-[320px]"></div>
            </div>
            
            <!-- 重點改寫：直觀式投手姿勢與多球種出手點對比圖 -->
            <div class="card p-4 md:p-6 bg-slate-900/90 border border-sky-500/30">
                <div class="mb-2">
                    <h2 class="text-lg font-semibold flex items-center gap-2 text-sky-300">
                        <i data-lucide="user" class="text-sky-400"></i> 各球種出手位置與高度一致性 (投手背面視角)
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">觀察不同球種 (FB, CB, SL, SP) 是否從同一個手臂角度與出手點釋放</p>
                </div>
                <div id="releaseChart" class="w-full h-[320px]"></div>
            </div>

            <div class="card p-4 md:p
